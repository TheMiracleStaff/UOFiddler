name: Build & Release The Miracle

on:
  push:
    branches:
      - "tm-main"
    paths-ignore:
      - '**/README.md'
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      Solution_Name: UoFiddler.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Restore & build the application
        run: dotnet build $env:Solution_Name --configuration $env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: UOFiddler-${{ runner.os }}-${{ runner.arch }}
          path: ./UOFiddler/bin/Release/

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      Asset_Name: UOFiddler-TM-Windows-x64-${{ github.ref_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: UOFiddler-Windows-X64
          path: ./UOFiddler-Windows-X64/

      - name: Archive release
        run: 7z a -tzip ${{ env.Asset_Name }}.zip './UOFiddler-Windows-X64'

      - name: Create release
        uses: softprops/action-gh-release@v2.6.1
        with:
          name: UOFiddler TM ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ env.Asset_Name }}.zip
